name: Testing Tasks Week 06

env:
  WEEK: &week week_06

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Select tasks to test'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - unique_ptr
          - smart_ptr
          - binary_records
          - simple_list

  schedule:
    - cron: '59 20 20 11 *'  # UTC: 20:59 = 23:59 MSK 20 November

jobs:
  test:
    uses: ./.github/workflows/run_tests.yml
    with:
      week: *week
      task: ${{ github.event_name == 'schedule' && 'all' || inputs.task }}